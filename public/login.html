<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Log in | E-Learning</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#1b3f7a; --ink:#0f2d5c; --line:#dfe5ec; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:"Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(140deg,#f3f9fd 0%,#e4eefa 100%); }
  .card { width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:34px 30px; box-shadow:0 20px 50px rgba(0,30,70,.12); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .brand svg { width:46px; height:46px; }
  .brand b { font-size:24px; line-height:1; }
  .brand small { display:block; font-size:11px; font-weight:600; color:#5a6475; margin-top:3px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.lead { margin:0 0 22px; color:#5a6475; font-size:14.5px; }
  label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
  input { width:100%; height:46px; border:1px solid var(--line); border-radius:9px; padding:0 12px; font:inherit; outline:none; }
  input:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(27,63,122,.12); }
  button { width:100%; height:48px; margin-top:22px; border:0; border-radius:9px; background:var(--navy);
    color:#fff; font:inherit; font-weight:800; cursor:pointer; }
  button:hover { background:#163568; }
  button[disabled] { opacity:.6; cursor:default; }
  .error { margin-top:16px; background:#fdecec; color:#8a1c1c; border:1px solid #f5c2c2;
    border-radius:9px; padding:10px 12px; font-size:14px; }
  .error[hidden] { display:none; }
  .foot { margin-top:22px; font-size:12.5px; color:#7a8699; text-align:center; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 8 3 18l21 10 21-10z" fill="#1b3f7a"/>
        <path d="M11 23v9c0 3 6 7 13 7s13-4 13-7v-9l-13 6z" fill="#1b3f7a" opacity=".85"/>
        <path d="M42 19v11" stroke="#1b3f7a" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="42" cy="32" r="2.4" fill="#1b3f7a"/>
      </svg>
      <span><b>E-Learning</b><small>STUDENT PORTAL</small></span>
    </div>
    <h1>Log in</h1>
    <p class="lead">Use the username and password you received.</p>
    <form id="form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="submit">Log in</button>
    </form>
    <p class="error" id="error" hidden></p>
    <p class="foot">Forgot your password? Ask your teacher for a new one.</p>
  </main>
<script>
  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = "Logging in…";
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username.value.trim(), password: password.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Could not log in.");
      location.href = data.user?.role === "admin" ? "/admin.html" : "/";
      return;
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
      password.value = "";
      password.focus();
    }
    submit.disabled = false;
    submit.textContent = "Log in";
  });
</script>
</body>
</html>
